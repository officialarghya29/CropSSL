name: CropSSL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax & import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Syntax check (compileall)
        run: python3 -m compileall -q crop_ssl

      - name: Module import smoke test
        run: |
          python3 - <<'PYEOF'
          import pathlib, importlib, sys
          # Import every .py module under crop_ssl.
          # crop_ssl.frontend.app is excluded: it is a Streamlit entrypoint
          # that requires the streamlit runtime session (verified via AppTest).
          skip = {"crop_ssl.frontend.app"}
          failures = []
          count = 0
          for f in sorted(pathlib.Path("crop_ssl").rglob("*.py")):
              if "__pycache__" in str(f) or str(f).endswith("__init__.py"):
                  continue
              rel = f.with_suffix("").as_posix().replace("/", ".")
              if rel in skip:
                  continue
              count += 1
              try:
                  importlib.import_module(rel)
              except Exception as e:
                  failures.append(f"{rel}: {type(e).__name__}: {e}")
          for fail in failures:
              print("IMPORT FAIL", fail)
          if failures:
              sys.exit(1)
          print(f"{count} modules imported OK")
          PYEOF

      - name: Check no secrets committed
        run: |
          if git grep -nE "(AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|sk-[0-9A-Za-z]{32}|BEGIN (RSA|OPENSSH) PRIVATE)" -- . ':!*.pyc' > /dev/null 2>&1; then
            echo "Potential secret found in repository"
            exit 1
          fi
          echo "No obvious secrets"

  test:
    name: Full test suite (215 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      - name: Run test suite
        run: python3 -m pytest crop_ssl/tests/test_all.py -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [checks]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cropssl:ci .
